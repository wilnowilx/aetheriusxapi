  </text>
  <text x="80" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#71717a">
    aetheriusxapi.com · GitHub: wilnowilx/aetheriusxapi
  </text>
  
  <!-- Purple heart -->
  <text x="1050" y="530" font-size="80">💜</text>
