<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Title -->
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff">
    I Built an API Marketplace
  </text>
  <text x="80" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff">
    Where AI Agents Pay Per Request
  </text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#accent)">
    in USDC on Base
  </text>
  
  <!-- Stats -->
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa">
    80 Endpoints · 4 Days · $5.80 · Solo Builder
  </text>
  
  <!-- Brand -->
  <text x="80" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#a855f7">
