<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aetheriusxapi — live demo (real testnet USDC)</title>
<style>
:root{--bg:#06060e;--purple:#a855f7;--magenta:#d946ef;--green:#10b981;--orange:#f59e0b;--text:#f0f0f5;--sec:#8a8a9a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1000px 500px at 50% -10%,rgba(168,85,247,.18),transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.wrap{width:100%;max-width:920px}
h1{font-size:clamp(18px,3vw,26px)}
.sub{color:var(--sec);font-size:14px;margin:8px 0 18px}
.sub a{color:#c084fc}
.term{background:rgba(4,4,10,.92);border:1px solid rgba(168,85,247,.4);border-radius:0 0 12px 12px;text-align:left;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;
  padding:16px 18px;min-height:44vh;box-shadow:0 0 60px rgba(168,85,247,.15);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.term .banner{color:var(--purple);font-weight:700}
.term .ok{color:var(--green)} .term .warn{color:var(--orange)} .term .dim{color:var(--sec)}
.cursor{display:inline-block;width:9px;height:17px;background:var(--purple);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.controls{margin:16px 0;display:flex;gap:10px;justify-content:center}
.controls button{background:linear-gradient(90deg,var(--purple),var(--magenta));color:#fff;border:none;
  border-radius:9px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px}
.controls button.ghost{background:transparent;border:1px solid rgba(255,255,255,.2)}
.back{margin-top:14px;font-size:13px;color:var(--sec)} .back a{color:#c084fc}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.stat{border:1px solid rgba(168,85,247,.35);background:rgba(168,85,247,.07);border-radius:20px;padding:5px 14px;font-size:12px;letter-spacing:.06em;color:#e9d5ff;font-family:ui-monospace,monospace}
.termchrome{display:flex;align-items:center;gap:8px;background:#101018;border:1px solid rgba(168,85,247,.4);border-bottom:none;border-radius:12px 12px 0 0;padding:9px 14px;font-family:ui-monospace,monospace;font-size:12px;color:var(--sec);text-align:left}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.termchrome .title{margin:0 auto;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 .grad{background:linear-gradient(90deg,#a855f7,#d946ef,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
#plasma-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
.plasma-blob{position:absolute;border-radius:42% 58% 63% 37%/45% 42% 58% 55%;filter:blur(90px);mix-blend-mode:screen;animation:plasmaFloat 14s ease-in-out infinite alternate,auroraMorph 19s ease-in-out infinite alternate}
.plasma-blob:nth-child(1){width:560px;height:560px;background:radial-gradient(circle,rgba(168,85,247,.5) 0%,transparent 70%);top:-12%;left:-8%;animation-duration:16s}
.plasma-blob:nth-child(2){width:480px;height:480px;background:radial-gradient(circle,rgba(217,70,239,.45) 0%,transparent 70%);top:35%;right:-10%;animation-duration:13s;animation-delay:-5s}
.plasma-blob:nth-child(3){width:420px;height:420px;background:radial-gradient(circle,rgba(236,72,153,.4) 0%,transparent 70%);bottom:-8%;left:25%;animation-duration:15s;animation-delay:-9s}
@keyframes plasmaFloat{0%{transform:translate(0,0) scale(1)}25%{transform:translate(80px,-55px) scale(1.14)}50%{transform:translate(-45px,70px) scale(.94)}75%{transform:translate(60px,25px) scale(1.06)}100%{transform:translate(-30px,-45px) scale(1)}}
@keyframes auroraMorph{0%,100%{border-radius:42% 58% 63% 37%/45% 42% 58% 55%}33%{border-radius:63% 37% 42% 58%/55% 58% 42% 45%}66%{border-radius:37% 63% 55% 45%/42% 55% 45% 58%}}
@media (prefers-reduced-motion: reduce){.cursor{animation:none}}
</style>
</head>
<body>
<div id="plasma-bg"><div class="plasma-blob"></div><div class="plasma-blob"></div><div class="plasma-blob"></div></div>
<div class="wrap">
<h1>AETHERIUS — <span class="grad">live 402&rarr;200 demo</span> (real testnet USDC)</h1>

<div class="stats"><span class="stat">40 ENDPOINTS LIVE</span><span class="stat">x402 + USDC</span><span class="stat">BASE SEPOLIA</span><span class="stat">~19S RUNTIME</span></div>
<div class="termchrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">aetheriusxapi — live-demo.cast</span></div>
<div class="term" id="term"></div>
<div class="controls">
<button id="btnPlay">▶ Play</button>
<button id="btnReplay" class="ghost">↻ Replay</button>
</div>
<p class="back"><a href="https://wilnowilx.github.io/aetheriusxapi/">← back to aetheriusxapi</a> · <a href="./take-1.cast">raw .cast file</a></p>
</div>
<script>
(function(){
var term = document.getElementById('term');
var btnPlay = document.getElementById('btnPlay');
var btnReplay = document.getElementById('btnReplay');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function line(t, cls){return '<div class="'+(cls||'')+'">'+esc(t)+'</div>';}
function banner(t){return '<div class="banner">'+esc(t)+'</div>';}
var S = [
[1500, banner('========================================================')+banner('  t+  0s  [1/6] HOOK — agents can\'t hold credit cards. How do they pay for APIs?')+banner('========================================================')],
[1600, line('AETHERIUS: where AI agents pay per call in USDC on Base.')+line('Agent wallet: 0x677B483128D0399bCD0A5AB36eE990C0246d7f61')+line('Verify yourself: https://sepolia.basescan.org/address/0x677B483128D0399bCD0A5AB36eE990C0246d7f61','dim')],
[4000, banner('========================================================')+banner('  t+  2s  [2/6] DISCOVERY — live catalog via the SDK')+banner('========================================================')],
[4100, line('Service 2.0.0 on eip155:84532')+line('Live endpoints: 40')+line('Cheapest: /v1/data/define at $0.005/call')+line('Demoing /v1/email/validate at $0.005/call (client\'s choice).')],
[6500, banner('========================================================')+banner('  t+  5s  [3/6] CHALLENGE — no payment, no data (402)')+banner('========================================================')],
[6600, line('HTTP 402 — empty body. No proof, you don\'t exist.','warn')+line('Catalog price: $0.005/call USDC.')],
[9000, banner('========================================================')+banner('  t+  7s  [4/6] SETTLEMENT — real USDC, real data (200)')+banner('========================================================')],
[9400, line('USDC balance before: 20.0')],
[10500, line('HTTP 200','ok')+line('{')+line('  "email": "agent@gmail.com",')+line('  "valid_syntax": true,')+line('  "has_mx": true,')+line('  "is_disposable": false,')+line('  "risk_score": 0,')+line('  "verdict": "valid"')+line('}')],
[10900, line('USDC balance after: 20.0 (spent: $0.0000)')+line('That discount IS the proof. Real money, not simulated.')+line('Montage — three more APIs, same flow, all real:')],
[12400, line('  200 /v1/data/define — {"query": "agent", "count": 1, ...}','ok')],
[13500, line('  200 /v1/token/price — USDC $1.00 on Base','ok')],
[15500, line('  200 /v1/news/hn-item — "Pre-Release of Polars 2.0"','ok')],
[17900, banner('========================================================')+banner('  t+ 16s  [5/6] LIVE PROOF — telemetry moved because of us')+banner('========================================================')],
[18000, line('Calls: 1114 | Paid: 1022 | Settled USDC: $0.52','ok')],
[20400, banner('========================================================')+banner('  t+ 19s  [6/6] CTA')+banner('========================================================')],
[20500, line('AETHERIUS — https://wilnowilx.github.io/aetheriusxapi/')+line('Verifiable txs: https://sepolia.basescan.org/address/0x677B483128D0399bCD0A5AB36eE990C0246d7f61','dim')+line('Done in t+19s with real USDC on Base Sepolia.','ok')]
];
var timers = [], playing = false, reduced = false;
try{ reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function clear(){ timers.forEach(clearTimeout); timers = []; }
function renderAll(){
  term.innerHTML = '';
  S.forEach(function(s){ term.innerHTML += s[1]; });
  term.innerHTML += '<span class="cursor"></span>';
  term.scrollTop = term.scrollHeight;
}
function play(){
  clear(); term.innerHTML = ''; playing = true; btnPlay.textContent = '⏸ Pause';
  S.forEach(function(s){
    timers.push(setTimeout(function(){
      term.innerHTML += s[1] + '<span class="cursor" id="cur"></span>';
      var c = document.getElementById('cur'); if(c) c.scrollIntoView({block:'nearest'});
      term.scrollTop = term.scrollHeight;
    }, s[0]));
  });
  timers.push(setTimeout(function(){ playing = false; btnPlay.textContent = '▶ Play'; }, 21500));
}
function toggle(){ if(playing){ clear(); playing = false; btnPlay.textContent = '▶ Play'; } else { play(); } }
btnPlay.onclick = toggle;
btnReplay.onclick = function(){ play(); };
if(reduced){ renderAll(); } else { play(); }
})();
</script>
<script>window.AEX_FX={n:45,speed:.7};</script>
<script src="../../fx.js"></script>
</body>
</html>
