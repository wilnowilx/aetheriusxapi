# aetheriusxAPI public TLS — 34-156-149-38.sslip.io
# Optimized for agent workloads: keepalive, compression, fast handshakes

# Upstream: FastAPI backend with keepalive connections
upstream aetherapi_backend {
    server 127.0.0.1:4020;
    keepalive 32;               # 32 persistent connections to FastAPI
    keepalive_timeout 60s;      # Hold connections open 60s
    keepalive_requests 1000;    # Reuse each connection 1000 times
}

server {
    listen 443 ssl http2;
    server_name 34-156-149-38.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-156-149-38.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-156-149-38.sslip.io/privkey.pem;

    # --- TLS optimization ---
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src https:; script-src https: 'unsafe-inline'; style-src https: 'unsafe-inline'" always;

    # --- Compression (gzip, brotli not installed) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # --- Rate limiting ---
    limit_req zone=api_limit burst=50 nodelay;
    limit_conn conn_limit 20;

    # --- API proxy (optimized) ---
    location /aetherapi/ {
        proxy_pass http://aetherapi_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";            # CRITICAL: enables keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts tuned for agent workloads
        proxy_read_timeout 30s;                    # Agents are fast, don't wait 90s
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;

        # Buffering for small agent responses
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        # Cache static responses (discovery, health)
        proxy_cache_valid 200 30s;                 # 30s cache for 200s
        proxy_cache_valid 404 5s;
    }

    # --- Static assets (long cache) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://aetherapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- Health endpoint (no cache, fast) ---
    location = /aetherapi/health {
        proxy_pass http://aetherapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache off;
        access_log off;
    }

    # --- Root ---
    location = / {
        default_type text/plain;
        return 200 'aetheriusxAPI TLS ok\n';
    }
}
