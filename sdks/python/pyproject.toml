[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheriusx"
version = "0.1.0"
description = "Python client for AetheriusX agent APIs"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
