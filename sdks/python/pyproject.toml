[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheriusx"
version = "2.0.0"
description = "Python SDK for AetheriusX — 80 APIs where AI agents pay per request in USDC on Base"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0"]
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AETHERIUS"}]
keywords = ["api", "crypto", "x402", "usdc", "base", "ai", "agents"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
