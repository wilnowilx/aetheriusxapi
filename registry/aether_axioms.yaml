name: "aether_axioms"
version: "1.0.0"
description: "AETHERIUS Research Layer — Fundamental Axioms, Ontology, Settlement Window Defense for M2M commerce on Base"
repository: "https://github.com/wilnowilx/aetheriusxapi/tree/main/aether_axioms_mcp"
pypi: "aether-axioms-mcp"
license: "MIT"
homepage: "https://wilnowilx.github.io/aetheriusxapi"
tags: ["x402", "axioms", "ontology", "settlement-window", "research", "credit-velocity", "m2m"]
transport: ["stdio", "sse", "http"]
tools:
  - name: "get_axioms"
    description: "Returns all AETHERIUS fundamental axioms"
  - name: "get_axiom"
    description: "Returns a specific axiom by ID"
  - name: "get_ontology"
    description: "Returns the AETHERIUS ontology (classes, properties, individuals)"
  - name: "query_axiom"
    description: "Query axioms by domain, keyword, or applicable system"
  - name: "validate_axiom_application"
    description: "Given a system description, check which axioms apply"
resources:
  - "axioms://axioms"
  - "axioms://ontology"
  - "axioms://axiom/{id}"
