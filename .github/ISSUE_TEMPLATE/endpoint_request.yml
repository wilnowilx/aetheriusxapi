name: Endpoint proposal
description: Propose a new paid or free API endpoint for the marketplace
title: "[endpoint] "
labels: [endpoint]
body:
  - type: input
    id: route
    attributes:
      label: Proposed route
      placeholder: "GET /v1/defi/yields"
    validations: { required: true }
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options: [Paid ($0.001–$0.03), FREE x402 Intelligence, FREE QuantumXBrain]
    validations: { required: true }
  - type: textarea
    id: upstream
    attributes:
      label: Upstream source
      description: Keyless preferred. If keyed, who holds the key and how?
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why agents need it
      description: Which agent job-to-be-done does this unlock? Who pays per call?
    validations: { required: true }
  - type: textarea
    id: shape
    attributes:
      label: Response shape (sketch)
      render: json
