name: Telegram Auto-Post

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  post-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Post to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "ERROR: TELEGRAM_TOKEN secret not found!"
            echo "Go to: https://github.com/wilnowilx/aetheriusxapi/settings/secrets/actions"
            echo "Add secret named TELEGRAM_TOKEN with your bot token"
            exit 1
          fi
          
          CHANNEL_ID="-1004315249717"
          GROUP_ID="-1004320337418"
          DATE=$(date -u +"%b %d, %Y")
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l)
          COMMITS=$(git log --oneline -3 --pretty=format:"%s" 2>/dev/null | head -3)
          
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DAY=$(date -u +%u)
            CONTENT=$(python3 -c "
          import json
          with open('content/calendar.json') as f:
              data = json.load(f)
          tweets = data['tweets']
          i = int('$DAY') - 1
          print(tweets[i]['content'] if i < len(tweets) else 'AETHERIUS: 40 APIs live on Base. The Infrastructure for Agents That Pay.')
          " 2>/dev/null || echo "AETHERIUS: 40 APIs live on Base. The Infrastructure for Agents That Pay.")
          else
            CONTENT="AETHERIUS Deploy - $DATE
          Files changed: $FILES_CHANGED
          Latest: $COMMITS
          Live: wilnowilx.github.io/aetheriusxapi"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHANNEL_ID}" \
            -d text="${CONTENT}" \
            -d disable_web_page_preview="true"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${GROUP_ID}" \
            -d text="${CONTENT}" \
            -d disable_web_page_preview="true"
          
          echo "Posted to channel and supergroup!"
