[project]
name = "aether-oracle-mcp"
version = "1.0.0"
description = "MCP server for x402 endpoint discovery on AetherX"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = [".""]
