[project]
name = "aetherius-axioms-mcp"
version = "1.0.0"
description = "MCP server for AETHERIUS fundamental axioms and ontology"
readme = "README.md"
authors = [{name = "AETHERIUS Research"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "rdflib>=7.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio-mode = "auto"
testpaths = ["tests"]